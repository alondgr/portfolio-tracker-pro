name: System Maintenance & DevOps Routine

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:
    # Allow manual triggering from GitHub UI

jobs:
  run-health-scanner:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Health & Dependency Scanner
        run: node scripts/health-scanner.js
        
      - name: Create System Maintenance Ticket (GitHub Issue)
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "System Maintenance Ticket - ${{ github.run_id }}"
          content-filepath: ./maintenance-report.md
          labels: |
            maintenance
            automated
